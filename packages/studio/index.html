<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HyperFrames Studio</title>
    <script>
      // Before the first paint: the theme the toggle saved, else the system's (owner: src/utils/studioTheme.ts).
      try {
        var theme = JSON.parse(localStorage.getItem("hf-studio-ui-preferences") || "{}").theme;
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches === false ? "light" : "dark";
        if (theme === "light") document.documentElement.dataset.theme = "paper";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div data-hf-id="hf-aph5" id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
