<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Studio playback fixture</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #0f172a;
        font-family: Arial, sans-serif;
      }
      .tile {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 24px;
        background: #38bdf8;
      }
      .title {
        position: absolute;
        left: 120px;
        top: 820px;
        margin: 0;
        font-size: 120px;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main
      id="studio-playback"
      data-hf-id="studio-playback"
      data-composition-id="studio-playback"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="12"
      data-fps="30"
    >
      <h1 class="title" data-hf-id="title">Playback</h1>
    </main>
    <script>
      const root = document.getElementById("studio-playback");
      const tl = gsap.timeline({ paused: true });
      for (let i = 0; i < 24; i += 1) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.hfId = `tile-${i}`;
        tile.style.left = `${120 + (i % 8) * 210}px`;
        tile.style.top = `${120 + Math.floor(i / 8) * 210}px`;
        root.appendChild(tile);
        tl.to(
          tile,
          {
            x: 60,
            rotation: 180,
            opacity: 0.4,
            duration: 2,
            repeat: 5,
            yoyo: true,
            ease: "sine.inOut",
          },
          i * 0.05,
        );
      }
      tl.from(".title", { y: 80, opacity: 0, duration: 1 }, 0);
      window.__timelines = { "studio-playback": tl };
    </script>
  </body>
</html>
